<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Memori Cake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* ===== ẢNH NỀN ===== */
            background: url('images/Images/nền\ đăng\ nhập.jpg') center/cover no-repeat fixed;
            position: relative;
        }
        .login-card {
            position: relative;
            z-index: 1;
            width: 900px;
            max-width: 95%;
            height: 540px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
        }

        /* ===== CỘT TRÁI - FORM ĐĂNG NHẬP ===== */
        .left-panel {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 32px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: #f0f0f0;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: background 0.2s;
        }

        .form-group input:focus {
            background: #e8e8e8;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 18px;
            padding: 0;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 24px;
            font-size: 14px;
        }

        .options-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #444;
            cursor: pointer;
        }

        .options-row a {
            color: #666;
            text-decoration: none;
        }

        .options-row a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #9b1c1c;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #7f1616;
        }

        .social-section {
            margin-top: 28px;
            text-align: center;
        }

        .social-section p {
            font-size: 14px;
            color: #555;
            margin-bottom: 16px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: #f5f5f5;
            border-color: #bbb;
        }

        /* ===== CỘT PHẢI - PROMO ===== */
        .right-panel {
            flex: 1;
            /* ===== ẢNH NỀN CỘT PHẢI ===== */
            background: linear-gradient(135deg, #ff81e4 0%, #c02b62 50%, #e73cbc 100%);
            background: url('images/Images/ảnh\ login.png') center/cover; 
            color: #700751;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 32px;
            position: relative;
        }

        .right-panel h2 {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            color: #720531;
            position: relative;
        }

        .right-panel h2 span {
            display: block;
            font-size: 42px;
            letter-spacing: 1px;
        }

        .right-panel p {
            font-size: 15px;
            margin: 20px 0 32px;
            opacity: 0.9;
            max-width: 260px;
            line-height: 1.5;
        }

        .btn-register {
            padding: 12px 40px;
            background: transparent;
            border: 2px solid #68042f;
            color: #63023a;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }

        .btn-register:hover {
            background: white;
            color: #8b1a1a;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .login-card {
                flex-direction: column;
                height: auto;
                max-width: 420px;
            }

            .left-panel,
            .right-panel {
                padding: 36px 28px;
            }

            .right-panel {
                order: -1; /* đưa phần promo lên trên trên mobile */
            }

            .right-panel h2 {
                font-size: 28px;
            }

            .right-panel h2 span {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Cột trái: Form đăng nhập -->
        <div class="left-panel">
            <h1>Đăng nhập</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <input type="email" 
                           name="email" 
                           placeholder="example@email.com" 
                           required>
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Nhập mật khẩu" 
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        👁
                    </button>
                </div>

                <div class="options-row">
                    <label>
                        <input type="checkbox" name="remember">
                        Lưu mật khẩu
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-login">Đăng Nhập</button>
            </form>

            <div class="social-section">
                <p>hoặc sử dụng tài khoản của bạn</p>
                <div class="social-buttons">
                    <button type="button" class="social-btn" title="Facebook">f</button>
                    <button type="button" class="social-btn" title="Google">G</button>
                </div>
            </div>
        </div>

        <!-- Cột phải: Promo đăng ký -->
        <div class="right-panel">
            <h2>
                Bắt Đầu Cùng
                <span>Memori Cake</span>
            </h2>
            <p>Nếu bạn chưa có tài khoản<br>đăng ký ngay nào</p>
            <button type="button" class="btn-register" onclick="location.href='register.html'">
                Đăng Ký
            </button>
        </div>
    </div>
</body>
</html>
