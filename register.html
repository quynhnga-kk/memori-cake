<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Memori Cake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* ===== ẢNH NỀN (tên khác với trang đăng nhập) ===== */
            background: url('images/Images/nền\ đăng\ nhập.jpg') center/cover no-repeat fixed;
            position: relative;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 920px;
            max-width: 95%;
            min-height: 580px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
        }

        /* ===== CỘT TRÁI - FORM ĐĂNG KÝ ===== */
        .left-panel {
            flex: 1.15;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 12px;
            background: #f0f0f0;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: background 0.2s;
        }

        .form-group input:focus {
            background: #e8e8e8;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 46px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 17px;
            padding: 0;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #9b1c1c;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-register:hover {
            background: #7f1616;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #9b1c1c;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ===== CỘT PHẢI - PROMO ===== */
        .right-panel {
            flex: 0.85;
            /* ===== ẢNH NỀN CỘT PHẢI (tên khác) ===== */
            background: url('images/Images/ảnh\ login.png') center/cover;
            color: #700751;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 28px;
            position: relative;
        }

        .right-panel h2 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 12px;
            color: #720531;
            position: relative;
        }

        .right-panel h2 span {
            display: block;
            font-size: 38px;
            letter-spacing: 1px;
        }

        .right-panel p {
            font-size: 15px;
            margin: 18px 0 28px;
            opacity: 0.9;
            max-width: 240px;
            line-height: 1.5;
        }

        .btn-login-side {
            padding: 12px 36px;
            background: transparent;
            border: 2px solid #68042f;
            color: #63023a;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }

        .btn-login-side:hover {
            background: white;
            color: #8b1a1a;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .login-card {
                flex-direction: column;
                height: auto;
                max-width: 420px;
            }

            .left-panel,
            .right-panel {
                padding: 32px 24px;
            }

            .right-panel {
                order: -1;
            }

            .right-panel h2 {
                font-size: 26px;
            }

            .right-panel h2 span {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Cột trái: Form đăng ký -->
        <div class="left-panel">
            <h1>Đăng ký tài khoản</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <input type="text" 
                           name="name" 
                           placeholder="Họ và tên" 
                           required>
                </div>

                <div class="form-group">
                    <input type="email" 
                           name="email" 
                           placeholder="Email" 
                           required>
                </div>

                <div class="form-group">
                    <input type="tel" 
                           name="phone" 
                           placeholder="Số điện thoại (09xxxxxxxx)">
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Mật khẩu" 
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        👁
                    </button>
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" 
                           id="confirm-password" 
                           name="confirm-password" 
                           placeholder="Xác nhận mật khẩu" 
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">
                        👁
                    </button>
                </div>

                <button type="submit" class="btn-register">Đăng Ký</button>
            </form>

            <div class="login-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>
        </div>

        <!-- Cột phải: Promo -->
        <div class="right-panel">
            <h2>
                Chào mừng đến
                <span>Memori Cake</span>
            </h2>
            <p>Tạo tài khoản để trải nghiệm những sản phẩm tuyệt vời nhất</p>
            <button type="button" class="btn-login-side" onclick="location.href='login.html'">
                Đăng Nhập
            </button>
        </div>
    </div>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }
    </script>
</body>
</html>
