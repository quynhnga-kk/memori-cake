<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Memori Cake</title>
</head>

<body>

<header>
    <h1>🍰 Memori Cake</h1>

    <nav>
        <a href="index.html">Trang chủ</a> |
        <a href="products.html">Sản phẩm</a> |
        <a href="contact.html">Liên hệ</a> |
        <a href="cart.html">🛒 Giỏ hàng</a>
    </nav>
</header>

<hr>

<main>

    <section>

        <h2>Đăng nhập</h2>

        <form>

            <label for="login-email">
                Email:
            </label>
            <br>

            <input type="email"
                   id="login-email"
                   name="email"
                   placeholder="Nhập email"
                   required>

            <br><br>

            <label for="login-password">
                Mật khẩu:
            </label>
            <br>

            <input type="password"
                   id="login-password"
                   name="password"
                   placeholder="Nhập mật khẩu"
                   required>

            <br><br>

            <label>
                <input type="checkbox"
                       name="remember">
                Ghi nhớ đăng nhập
            </label>

            <br><br>

            <button type="submit">
                Đăng nhập
            </button>

            <p>
                <a href="#">Quên mật khẩu?</a>
            </p>

        </form>

    </section>

    <hr>

    <section>

        <h2>Tạo tài khoản</h2>

        <form>

            <label for="register-name">
                Họ và tên:
            </label>
            <br>

            <input type="text"
                   id="register-name"
                   name="name"
                   placeholder="Nguyễn Văn A"
                   required>

            <br><br>

            <label for="register-email">
                Email:
            </label>
            <br>

            <input type="email"
                   id="register-email"
                   name="email"
                   placeholder="example@gmail.com"
                   required>

            <br><br>

            <label for="register-phone">
                Số điện thoại:
            </label>
            <br>

            <input type="tel"
                   id="register-phone"
                   name="phone"
                   placeholder="09xxxxxxxx">

            <br><br>

            <label for="register-password">
                Mật khẩu:
            </label>
            <br>

            <input type="password"
                   id="register-password"
                   name="password"
                   placeholder="Nhập mật khẩu"
                   required>

            <br><br>

            <label for="confirm-password">
                Xác nhận mật khẩu:
            </label>
            <br>

            <input type="password"
                   id="confirm-password"
                   name="confirm-password"
                   placeholder="Nhập lại mật khẩu"
                   required>

            <br><br>

            <button type="submit">
                Đăng ký
            </button>

        </form>

    </section>

</main>

<hr>

<footer>
    <p>© 2026 Memori Cake. All rights reserved.</p>
</footer>

</body>
</html>
