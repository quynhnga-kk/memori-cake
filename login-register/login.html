<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Memori Cake</title>
    
</head>
<link rel="stylesheet" href="login.css">
<body>

    <div class="login-card">
        <!-- Cột trái: Form đăng nhập -->
        <div class="left-panel">
            <h1>Đăng nhập</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <input type="email" 
                           name="email" 
                           placeholder="example@email.com" 
                           required>
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Nhập mật khẩu" 
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        👁
                    </button>
                </div>

                <div class="options-row">
                    <label>
                        <input type="checkbox" name="remember">
                        Lưu mật khẩu
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-login">Đăng Nhập</button>
            </form>

            <div class="social-section">
                <p>hoặc sử dụng tài khoản của bạn</p>
                <div class="social-buttons">
                    <button type="button" class="social-btn" title="Facebook">f</button>
                    <button type="button" class="social-btn" title="Google">G</button>
                </div>
            </div>
        </div>

        <!-- Cột phải: Promo đăng ký -->
        <div class="right-panel">
            <h2>
                Bắt Đầu Cùng
                <span>Memori Cake</span>
            </h2>
            <p>Nếu bạn chưa có tài khoản<br>đăng ký ngay nào</p>
            <button type="button" class="btn-register" onclick="location.href='register.html'">
                Đăng Ký
            </button>
        </div>
    </div>
</body>
</html>
